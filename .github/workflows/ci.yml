name: CI

on:
  push:
    branches:
      - main
      - test
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      telegram: ${{ steps.filter.outputs.telegram }}
      migrations: ${{ steps.filter.outputs.migrations }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'supabase/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            telegram:
              - 'telegram-bot/**'
              - '.github/workflows/ci.yml'
            migrations:
              - 'supabase/migrations/**'
              - '.github/workflows/ci.yml'
            deploy:
              - 'deploy/**'
              - 'DEPLOYMENT_CHECKLIST.md'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Run tests
        env:
          BACKEND_API_KEY: sk-agent-local-dev
          OPENROUTER_BUDGET_MONTHLY: "30.0"  # spell-checker: disable-line
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=65  # spell-checker: disable-line

  evals:
    name: Eval harness
    needs:
      - changes
      - backend
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run eval harness
        env:
          BACKEND_API_KEY: sk-agent-local-dev
          OPENROUTER_BUDGET_MONTHLY: "30.0"
        run: python3 backend/evals/run_eval_harness.py --ci --min-score 80

  frontend:
    name: Frontend Lint and Build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Approve pnpm build scripts
        run: pnpm approve-builds core-js sharp unrs-resolver

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.ignore-scripts=false

      - name: Lint
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm run lint

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          BACKEND_URL: http://127.0.0.1:8000
        run: pnpm run build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests (Playwright)
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm run test:e2e

  telegram:
    name: Telegram Bot Validation
    needs: changes
    if: needs.changes.outputs.telegram == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-bot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: telegram-bot/requirements-telegram.txt

      - name: Install dependencies
        run: pip install -r requirements-telegram.txt

      - name: Validate imports and syntax
        run: python -m py_compile bot.py

  migrations:
    name: SQL Migration Validation
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate SQL files exist
        run: |
          count=$(find supabase/migrations -name '*.sql' | wc -l)
          if [ $count -eq 0 ]; then
            echo "No SQL migration files found"
            exit 1
          fi
          echo "Found $count SQL migration files"

      - name: Check for SQL syntax issues
        run: |
          for file in supabase/migrations/*.sql; do
            if [ ! -s "$file" ]; then
              echo "Empty file: $file"
              exit 1
            fi
            echo "✓ $file ($(wc -l < "$file") lines)"
          done

  deploy:
    name: Deploy to VPS
    needs: [backend, frontend]
    # Only deploy on pushes to main — not on PRs, not on other branches.
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !failure() && !cancelled()
    runs-on: ubuntu-latest
    env:
      VPS_SECRETS_CONFIGURED: ${{ secrets.VPS_HOST != '' && secrets.VPS_USER != '' && secrets.VPS_SSH_KEY != '' }}
    steps:
      - name: Deploy via SSH
        if: env.VPS_SECRETS_CONFIGURED == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: bash ~/agent-system/deploy/deploy.sh

      - name: Skip (VPS secrets not configured)
        if: env.VPS_SECRETS_CONFIGURED != 'true'
        run: echo "Skipping deployment — VPS_HOST, VPS_USER, and VPS_SSH_KEY secrets must all be set in repository settings."

  deploy_baseline:
    name: Deploy Baseline Checks
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy scripts syntax
        run: |
          bash -n deploy/setup.sh
          bash -n deploy/deploy.sh
          bash -n deploy/preflight.sh
          bash -n deploy/hardening.sh
          bash -n deploy/monitoring-smoke.sh

      - name: Validate logrotate policy
        run: |
          test -f deploy/logrotate-agent-system.conf
          grep -q 'daily' deploy/logrotate-agent-system.conf
          grep -q 'rotate' deploy/logrotate-agent-system.conf
          grep -q 'compress' deploy/logrotate-agent-system.conf

      - name: Validate monitoring baseline (dry run)
        run: bash deploy/monitoring-smoke.sh --dry-run --base-url https://example.com
