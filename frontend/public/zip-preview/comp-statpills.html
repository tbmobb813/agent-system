<!doctype html>
<html lang="en" data-theme="neon-command" data-density="comfortable" data-motion="cinematic">
<head>
<meta charset="utf-8">
<title>comp-statpills</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body.atmosphere { padding: 18px 22px; min-height: 160px; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 14px; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .grid { display: grid; gap: 10px; }
</style>
</head>
<body class="atmosphere">
<div class="col" style="gap: 10px;">
  <div style="display: flex; gap: 14px; align-items: center;">
    <span style="display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-body); font-size: 13px;">
      <span style="width: 10px; height: 10px; border-radius: 999px; background: var(--success);"></span>
      <span style="color: var(--text); font-weight: 500;">Agent Online</span>
      <span style="color: var(--muted); font-size: 11px;">· 142 total tasks</span>
    </span>
  </div>
  <div style="display: flex; gap: 14px; align-items: center;">
    <span style="display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-body); font-size: 13px;">
      <span style="width: 10px; height: 10px; border-radius: 999px; background: var(--danger);"></span>
      <span style="color: var(--text); font-weight: 500;">Agent Offline</span>
      <span style="color: var(--muted); font-size: 11px;">· check OPENROUTER_API_KEY</span>
    </span>
  </div>
  <div style="display: flex; gap: 14px; align-items: center;">
    <span style="display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-body); font-size: 13px;">
      <span style="width: 10px; height: 10px; border-radius: 999px; background: var(--warn);"></span>
      <span style="color: var(--text); font-weight: 500;">Budget 87%</span>
      <span style="color: var(--muted); font-size: 11px;">· $3.92 remaining</span>
    </span>
  </div>
</div>
</body></html>
