<!doctype html>
<html lang="en" data-theme="neon-command" data-density="comfortable" data-motion="cinematic">
<head>
<meta charset="utf-8">
<title>color-neon-command</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body.atmosphere { padding: 18px 22px; min-height: 160px; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 14px; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .grid { display: grid; gap: 10px; }
</style>
</head>
<body class="atmosphere">
<div class="row" style="flex-wrap: wrap; gap: 10px;">
  <div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-start;">
      <div style="width: 88px; height: 64px; background: #060b12; border: 1px solid var(--border); border-radius: 10px;"></div>
      <code style="font-family: var(--font-mono); font-size: 10px; color: var(--text);">--bg</code>
      <code style="font-family: var(--font-mono); font-size: 10px; color: var(--muted);">#060b12</code>
    </div><div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-start;">
      <div style="width: 88px; height: 64px; background: #0c1521; border: 1px solid var(--border); border-radius: 10px;"></div>
      <code style="font-family: var(--font-mono); font-size: 10px; color: var(--text);">--bg-elev</code>
      <code style="font-family: var(--font-mono); font-size: 10px; color: var(--muted);">#0c1521</code>
    </div><div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-start;">
      <div style="width: 88px; height: 64px; background: #eaf4ff; border: 1px solid var(--border); border-radius: 10px;"></div>
      <code style="font-family: var(--font-mono); font-size: 10px; color: var(--text);">--text</code>
      <code style="font-family: var(--font-mono); font-size: 10px; color: var(--muted);">#eaf4ff</code>
    </div><div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-start;">
      <div style="width: 88px; height: 64px; background: #91a5bf; border: 1px solid var(--border); border-radius: 10px;"></div>
      <code style="font-family: var(--font-mono); font-size: 10px; color: var(--text);">--muted</code>
      <code style="font-family: var(--font-mono); font-size: 10px; color: var(--muted);">#91a5bf</code>
    </div><div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-start;">
      <div style="width: 88px; height: 64px; background: #2be3c6; border: 1px solid var(--border); border-radius: 10px;"></div>
      <code style="font-family: var(--font-mono); font-size: 10px; color: var(--text);">--accent</code>
      <code style="font-family: var(--font-mono); font-size: 10px; color: var(--muted);">#2be3c6</code>
    </div><div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-start;">
      <div style="width: 88px; height: 64px; background: #59a7ff; border: 1px solid var(--border); border-radius: 10px;"></div>
      <code style="font-family: var(--font-mono); font-size: 10px; color: var(--text);">--accent-2</code>
      <code style="font-family: var(--font-mono); font-size: 10px; color: var(--muted);">#59a7ff</code>
    </div>
</div>
</body></html>
