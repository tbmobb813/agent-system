<!doctype html>
<html lang="en" data-theme="neon-command" data-density="comfortable" data-motion="cinematic">
<head>
<meta charset="utf-8">
<title>comp-input</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body.atmosphere { padding: 18px 22px; min-height: 160px; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 14px; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .grid { display: grid; gap: 10px; }
</style>
</head>
<body class="atmosphere">
<div class="col" style="gap: 10px;">
  <input type="text" placeholder="Filter tables…" style="background: var(--bg-elev); color: var(--text); font: inherit; font-family: var(--font-body); font-size: 13px; border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; outline: none; width: 280px;" />
  <div style="display: flex; gap: 10px; align-items: center;">
    <select style="height: 36px; background: var(--bg-elev); color: var(--text); font: inherit; font-size: 13px; border: 1px solid var(--border); border-radius: 8px; padding: 0 10px;">
      <option>Neon Command</option><option>Starforge</option><option>Retro Grid</option><option>Clean Tech</option>
    </select>
    <select style="height: 36px; background: var(--bg-elev); color: var(--text); font: inherit; font-size: 13px; border: 1px solid var(--border); border-radius: 8px; padding: 0 10px;">
      <option>Comfortable</option><option>Compact</option>
    </select>
  </div>
</div>
</body></html>
