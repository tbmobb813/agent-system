<!doctype html>
<html lang="en" data-theme="neon-command" data-density="comfortable" data-motion="cinematic">
<head>
<meta charset="utf-8">
<title>spacing-radius</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body.atmosphere { padding: 18px 22px; min-height: 160px; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 14px; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .grid { display: grid; gap: 10px; }
</style>
</head>
<body class="atmosphere">
<div class="row" style="gap: 18px; align-items: flex-end;">
  <div style="display: flex; flex-direction: column; gap: 6px; align-items: center;">
      <div style="width: 64px; height: 64px; border: 1px solid var(--accent); background: color-mix(in oklab, var(--accent), transparent 88%); border-radius: 0.375rem;"></div>
      <code style="font-family: var(--font-mono); font-size: 10px; color: var(--text);">sm</code>
      <code style="font-family: var(--font-mono); font-size: 10px; color: var(--muted);">6px</code>
    </div><div style="display: flex; flex-direction: column; gap: 6px; align-items: center;">
      <div style="width: 64px; height: 64px; border: 1px solid var(--accent); background: color-mix(in oklab, var(--accent), transparent 88%); border-radius: 0.5rem;"></div>
      <code style="font-family: var(--font-mono); font-size: 10px; color: var(--text);">md</code>
      <code style="font-family: var(--font-mono); font-size: 10px; color: var(--muted);">8px</code>
    </div><div style="display: flex; flex-direction: column; gap: 6px; align-items: center;">
      <div style="width: 64px; height: 64px; border: 1px solid var(--accent); background: color-mix(in oklab, var(--accent), transparent 88%); border-radius: 0.75rem;"></div>
      <code style="font-family: var(--font-mono); font-size: 10px; color: var(--text);">lg</code>
      <code style="font-family: var(--font-mono); font-size: 10px; color: var(--muted);">12px</code>
    </div><div style="display: flex; flex-direction: column; gap: 6px; align-items: center;">
      <div style="width: 64px; height: 64px; border: 1px solid var(--accent); background: color-mix(in oklab, var(--accent), transparent 88%); border-radius: 0.95rem;"></div>
      <code style="font-family: var(--font-mono); font-size: 10px; color: var(--text);">panel</code>
      <code style="font-family: var(--font-mono); font-size: 10px; color: var(--muted);">15px</code>
    </div><div style="display: flex; flex-direction: column; gap: 6px; align-items: center;">
      <div style="width: 64px; height: 64px; border: 1px solid var(--accent); background: color-mix(in oklab, var(--accent), transparent 88%); border-radius: 999px;"></div>
      <code style="font-family: var(--font-mono); font-size: 10px; color: var(--text);">pill</code>
      <code style="font-family: var(--font-mono); font-size: 10px; color: var(--muted);">999px</code>
    </div>
</div>
</body></html>
