<!doctype html>
<html lang="en" data-theme="neon-command" data-density="comfortable" data-motion="cinematic">
<head>
<meta charset="utf-8">
<title>comp-panel</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body.atmosphere { padding: 18px 22px; min-height: 160px; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 14px; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .grid { display: grid; gap: 10px; }
</style>
</head>
<body class="atmosphere">
<div class="panel" style="padding: 16px 18px;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
    <h2 class="section-title" style="font-size: 14px; margin: 0;">Recent Tasks</h2>
    <a href="#" style="font-family: var(--font-body); font-size: 11px; color: var(--accent-2); text-decoration: none;">View all →</a>
  </div>
  <div style="display: grid; grid-template-columns: 64px 1fr auto auto; gap: 10px; align-items: center; font-family: var(--font-body); font-size: 12px; padding: 6px 0; border-bottom: 1px solid var(--border);">
    <span class="status-ok" style="font-weight: 600;">completed</span>
    <span style="color: var(--text);">Summarize quarterly OKRs from PDF</span>
    <span style="color: var(--muted); font-size: 11px;">5m ago</span>
    <span style="color: var(--muted); font-size: 11px;">$0.0042</span>
  </div>
  <div style="display: grid; grid-template-columns: 64px 1fr auto auto; gap: 10px; align-items: center; font-family: var(--font-body); font-size: 12px; padding: 6px 0;">
    <span class="status-running" style="font-weight: 600;">running</span>
    <span style="color: var(--text);">Compare GPT-4o and Sonnet on regex tasks</span>
    <span style="color: var(--muted); font-size: 11px;">just now</span>
    <span style="color: var(--muted); font-size: 11px;">—</span>
  </div>
</div>
</body></html>
