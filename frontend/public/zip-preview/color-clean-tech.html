<!doctype html>
<html lang="en" data-theme="neon-command" data-density="comfortable" data-motion="cinematic">
<head>
<meta charset="utf-8">
<title>color-clean-tech</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body.atmosphere { padding: 18px 22px; min-height: 160px; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 14px; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .grid { display: grid; gap: 10px; }
</style>
</head>
<body class="atmosphere">
<div class="row" style="flex-wrap: wrap; gap: 10px; background: #f2f7ff; padding: 12px; border-radius: 14px;">
  <div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-start;">
      <div style="width: 88px; height: 64px; background: #f2f7ff; border: 1px solid rgba(68,96,134,.23); border-radius: 10px;"></div>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #13213a;">--bg</code>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #50678a;">#f2f7ff</code>
    </div><div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-start;">
      <div style="width: 88px; height: 64px; background: #ffffff; border: 1px solid rgba(68,96,134,.23); border-radius: 10px;"></div>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #13213a;">--bg-elev</code>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #50678a;">#ffffff</code>
    </div><div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-start;">
      <div style="width: 88px; height: 64px; background: #13213a; border: 1px solid rgba(68,96,134,.23); border-radius: 10px;"></div>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #13213a;">--text</code>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #50678a;">#13213a</code>
    </div><div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-start;">
      <div style="width: 88px; height: 64px; background: #50678a; border: 1px solid rgba(68,96,134,.23); border-radius: 10px;"></div>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #13213a;">--muted</code>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #50678a;">#50678a</code>
    </div><div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-start;">
      <div style="width: 88px; height: 64px; background: #007cf5; border: 1px solid rgba(68,96,134,.23); border-radius: 10px;"></div>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #13213a;">--accent</code>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #50678a;">#007cf5</code>
    </div><div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-start;">
      <div style="width: 88px; height: 64px; background: #15c2a6; border: 1px solid rgba(68,96,134,.23); border-radius: 10px;"></div>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #13213a;">--accent-2</code>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #50678a;">#15c2a6</code>
    </div>
</div>
</body></html>
