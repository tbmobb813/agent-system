<!doctype html>
<html lang="en" data-theme="neon-command" data-density="comfortable" data-motion="cinematic">
<head>
<meta charset="utf-8">
<title>type-scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body.atmosphere { padding: 18px 22px; min-height: 160px; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 14px; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .grid { display: grid; gap: 10px; }
</style>
</head>
<body class="atmosphere">
<div class="col" style="gap: 6px; font-family: var(--font-body);">
  <div style="display: grid; grid-template-columns: 56px 1fr; gap: 8px; align-items: baseline;">
    <span style="font-family: var(--font-mono); color: var(--muted); font-size: 11px;">36</span><span style="font-size: 36px; font-weight: 700; line-height: 1;">Hero</span>
    <span style="font-family: var(--font-mono); color: var(--muted); font-size: 11px;">24</span><span style="font-size: 24px; font-weight: 700; line-height: 1;">Section</span>
    <span style="font-family: var(--font-mono); color: var(--muted); font-size: 11px;">18</span><span style="font-size: 18px; font-weight: 600; line-height: 1;">Subhead</span>
    <span style="font-family: var(--font-mono); color: var(--muted); font-size: 11px;">16</span><span style="font-size: 16px; line-height: 1;">Body — read me at speed.</span>
    <span style="font-family: var(--font-mono); color: var(--muted); font-size: 11px;">14</span><span style="font-size: 14px; line-height: 1; color: var(--muted);">Secondary supporting copy.</span>
    <span style="font-family: var(--font-mono); color: var(--muted); font-size: 11px;">12</span><span style="font-size: 12px; line-height: 1; color: var(--muted);">META · 0.22em tracking</span>
  </div>
</div>
</body></html>
