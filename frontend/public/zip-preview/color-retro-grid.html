<!doctype html>
<html lang="en" data-theme="neon-command" data-density="comfortable" data-motion="cinematic">
<head>
<meta charset="utf-8">
<title>color-retro-grid</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body.atmosphere { padding: 18px 22px; min-height: 160px; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 14px; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .grid { display: grid; gap: 10px; }
</style>
</head>
<body class="atmosphere">
<div class="row" style="flex-wrap: wrap; gap: 10px;" data-theme="retro-grid">
  <div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-start;">
      <div style="width: 88px; height: 64px; background: #09060f; border: 1px solid rgba(205,91,252,.28); border-radius: 10px;"></div>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #ffeafd;">--bg</code>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #d7acd8;">#09060f</code>
    </div><div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-start;">
      <div style="width: 88px; height: 64px; background: #161026; border: 1px solid rgba(205,91,252,.28); border-radius: 10px;"></div>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #ffeafd;">--bg-elev</code>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #d7acd8;">#161026</code>
    </div><div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-start;">
      <div style="width: 88px; height: 64px; background: #ffeafd; border: 1px solid rgba(205,91,252,.28); border-radius: 10px;"></div>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #ffeafd;">--text</code>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #d7acd8;">#ffeafd</code>
    </div><div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-start;">
      <div style="width: 88px; height: 64px; background: #d7acd8; border: 1px solid rgba(205,91,252,.28); border-radius: 10px;"></div>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #ffeafd;">--muted</code>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #d7acd8;">#d7acd8</code>
    </div><div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-start;">
      <div style="width: 88px; height: 64px; background: #ff4fd8; border: 1px solid rgba(205,91,252,.28); border-radius: 10px;"></div>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #ffeafd;">--accent</code>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #d7acd8;">#ff4fd8</code>
    </div><div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-start;">
      <div style="width: 88px; height: 64px; background: #54f2ff; border: 1px solid rgba(205,91,252,.28); border-radius: 10px;"></div>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #ffeafd;">--accent-2</code>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #d7acd8;">#54f2ff</code>
    </div>
</div>
</body></html>
