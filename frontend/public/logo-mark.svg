<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" role="img" aria-label="AI Agent">
  <defs>
    <linearGradient id="agent-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2be3c6"></stop>
      <stop offset="100%" stop-color="#59a7ff"></stop>
    </linearGradient>
    <filter id="agent-blur" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4"></feGaussianBlur>
    </filter>
  </defs>

  
  <g filter="url(#agent-blur)" opacity="0.55">
    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-family="Orbitron, &#39;Space Grotesk&#39;, system-ui, sans-serif" font-weight="700" font-size="28" letter-spacing="4" fill="url(#agent-glow)">AI AGENT</text>
  </g>

  
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-family="Orbitron, &#39;Space Grotesk&#39;, system-ui, sans-serif" font-weight="700" font-size="28" letter-spacing="4" fill="#2be3c6">AI AGENT</text>
</svg>