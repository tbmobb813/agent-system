<!doctype html>
<html lang="en" data-theme="neon-command" data-density="comfortable" data-motion="cinematic">
<head>
<meta charset="utf-8">
<title>color-retro-grid</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="./styles.css">
<style>
  html, body { margin: 0; padding: 0; }
  body.atmosphere { padding: 18px 22px; min-height: 160px; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 14px; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .grid { display: grid; gap: 10px; }
</style>
</head>
<body class="atmosphere">
<div class="row" class="pr-flex-wrap" data-theme="retro-grid">
  <div class="pr-flex-col-gap-6-start">
      <div style="width: 88px; height: 64px; background: #09060f; border: 1px solid rgba(205,91,252,.28); border-radius: 10px;"></div>
      <code class="pr-hex-light-2">--bg</code>
      <code class="pr-hex-mid">#09060f</code>
    </div><div class="pr-flex-col-gap-6-start">
      <div style="width: 88px; height: 64px; background: #161026; border: 1px solid rgba(205,91,252,.28); border-radius: 10px;"></div>
      <code class="pr-hex-light-2">--bg-elev</code>
      <code class="pr-hex-mid">#161026</code>
    </div><div class="pr-flex-col-gap-6-start">
      <div style="width: 88px; height: 64px; background: #ffeafd; border: 1px solid rgba(205,91,252,.28); border-radius: 10px;"></div>
      <code class="pr-hex-light-2">--text</code>
      <code class="pr-hex-mid">#ffeafd</code>
    </div><div class="pr-flex-col-gap-6-start">
      <div style="width: 88px; height: 64px; background: #d7acd8; border: 1px solid rgba(205,91,252,.28); border-radius: 10px;"></div>
      <code class="pr-hex-light-2">--muted</code>
      <code class="pr-hex-mid">#d7acd8</code>
    </div><div class="pr-flex-col-gap-6-start">
      <div style="width: 88px; height: 64px; background: #ff4fd8; border: 1px solid rgba(205,91,252,.28); border-radius: 10px;"></div>
      <code class="pr-hex-light-2">--accent</code>
      <code class="pr-hex-mid">#ff4fd8</code>
    </div><div class="pr-flex-col-gap-6-start">
      <div style="width: 88px; height: 64px; background: #54f2ff; border: 1px solid rgba(205,91,252,.28); border-radius: 10px;"></div>
      <code class="pr-hex-light-2">--accent-2</code>
      <code class="pr-hex-mid">#54f2ff</code>
    </div>
</div>
</body></html>
