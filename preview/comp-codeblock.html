<!doctype html>
<html lang="en" data-theme="neon-command" data-density="comfortable" data-motion="cinematic">
<head>
<meta charset="utf-8">
<title>comp-codeblock</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body.atmosphere { padding: 18px 22px; min-height: 160px; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 14px; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .grid { display: grid; gap: 10px; }
</style>
</head>
<body class="atmosphere">
<div style="border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: #1e1e1e;">
  <div style="display: flex; justify-content: space-between; align-items: center; background: var(--surface-soft); padding: 6px 12px; border-bottom: 1px solid var(--border);">
    <span style="font-family: var(--font-mono); font-size: 11px; color: var(--muted);">bash</span>
    <button style="background: transparent; border: none; font-family: var(--font-body); font-size: 11px; color: var(--muted); cursor: pointer;">Copy</button>
  </div>
  <pre style="margin: 0; padding: 10px 12px; font-family: var(--font-mono); font-size: 12px; color: #d4d4d4; line-height: 1.5;"><span style="color: #569cd6;">curl</span> -X POST http://localhost:8000/agent/stream \
  -H <span style="color: #ce9178;">"Content-Type: application/json"</span> \
  -d <span style="color: #ce9178;">'{"query": "Explain quantum computing briefly"}'</span></pre>
</div>
</body></html>
