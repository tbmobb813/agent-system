<!doctype html>
<html lang="en" data-theme="neon-command" data-density="comfortable" data-motion="cinematic">
<head>
<meta charset="utf-8">
<title>type-display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="./styles.css">
<style>
  html, body { margin: 0; padding: 0; }
  body.atmosphere { padding: 18px 22px; min-height: 160px; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 14px; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .grid { display: grid; gap: 10px; }
</style>
</head>
<body class="atmosphere">
<div class="col" style="gap: 4px;">
  <div style="font-family: var(--font-display); font-weight: 700; font-size: 36px; letter-spacing: .06em; color: var(--text); line-height: 1.05;">Operations Deck</div>
  <div style="font-family: var(--font-display); font-weight: 500; font-size: 22px; letter-spacing: .06em; color: var(--text); line-height: 1.2;">Telemetry &amp; budget, live.</div>
  <div class="pr-flex-between-gap-18">
    <span>Orbitron 700 · 36/40 · 0.06em</span><span>Orbitron 500 · 22/26 · 0.06em</span>
  </div>
</div>
</body></html>
