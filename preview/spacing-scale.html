<!doctype html>
<html lang="en" data-theme="neon-command" data-density="comfortable" data-motion="cinematic">
<head>
<meta charset="utf-8">
<title>spacing-scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="./styles.css">
<style>
  html, body { margin: 0; padding: 0; }
  body.atmosphere { padding: 18px 22px; min-height: 160px; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 14px; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .grid { display: grid; gap: 10px; }
</style>
</head>
<body class="atmosphere">
<div class="col pr-gap-8">
  
    <div class="pr-grid-60-1fr-50-gap-12">
      <code class="pr-font-mono-11-accent">space-1</code>
      <div style="height: 8px; width: 4px; background: var(--accent); border-radius: 999px; box-shadow: 0 0 8px rgba(43,227,198,0.4);"></div>
      <code class="pr-font-mono-11-muted">4px</code>
    </div>
  
    <div class="pr-grid-60-1fr-50-gap-12">
      <code class="pr-font-mono-11-accent">space-2</code>

    </div>
  
    <div class="pr-grid-60-1fr-50-gap-12">
      <code class="pr-font-mono-11-accent">space-3</code>

    </div>
  
    <div class="pr-grid-60-1fr-50-gap-12">
      <code class="pr-font-mono-11-accent">space-5</code>
      <div style="height: 8px; width: 20px; background: var(--accent); border-radius: 999px; box-shadow: 0 0 8px rgba(43,227,198,0.4);"></div>

    <div class="pr-grid-60-1fr-50-gap-12">

    </div>
  
    <div class="pr-grid-60-1fr-50-gap-12">
      <code class="pr-font-mono-11-accent">space-8</code>
      <div style="height: 8px; width: 32px; background: var(--accent); border-radius: 999px; box-shadow: 0 0 8px rgba(43,227,198,0.4);"></div>

</div>
</body></html>
