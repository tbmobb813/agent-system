<!doctype html>
<html lang="en" data-theme="neon-command" data-density="comfortable" data-motion="cinematic">
<head>
<meta charset="utf-8">
<title>color-starforge</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="./styles.css">
<style>
  html, body { margin: 0; padding: 0; }
  body.atmosphere { padding: 18px 22px; min-height: 160px; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 14px; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .grid { display: grid; gap: 10px; }
</style>
</head>
<body class="atmosphere">
<div class="row" class="pr-flex-wrap" data-theme="starforge">
  <div class="pr-flex-col-gap-6-start">
      <div style="width: 88px; height: 64px; background: #05050b; border: 1px solid rgba(132,124,190,.28); border-radius: 10px;"></div>
      <code class="pr-hex-light">--bg</code>
      <code class="pr-hex-mid-2">#05050b</code>
    </div><div class="pr-flex-col-gap-6-start">
      <div style="width: 88px; height: 64px; background: #111120; border: 1px solid rgba(132,124,190,.28); border-radius: 10px;"></div>
      <code class="pr-hex-light">--bg-elev</code>
      <code class="pr-hex-mid-2">#111120</code>
    </div><div class="pr-flex-col-gap-6-start">
      <div style="width: 88px; height: 64px; background: #f4f4ff; border: 1px solid rgba(132,124,190,.28); border-radius: 10px;"></div>
      <code class="pr-hex-light">--text</code>
      <code class="pr-hex-mid-2">#f4f4ff</code>
    </div><div class="pr-flex-col-gap-6-start">
      <div style="width: 88px; height: 64px; background: #b0b2cf; border: 1px solid rgba(132,124,190,.28); border-radius: 10px;"></div>
      <code class="pr-hex-light">--muted</code>
      <code class="pr-hex-mid-2">#b0b2cf</code>
    </div><div class="pr-flex-col-gap-6-start">
      <div style="width: 88px; height: 64px; background: #f4a524; border: 1px solid rgba(132,124,190,.28); border-radius: 10px;"></div>
      <code class="pr-hex-light">--accent</code>
      <code class="pr-hex-mid-2">#f4a524</code>
    </div><div class="pr-flex-col-gap-6-start">
      <div style="width: 88px; height: 64px; background: #73c3ff; border: 1px solid rgba(132,124,190,.28); border-radius: 10px;"></div>
      <code class="pr-hex-light">--accent-2</code>
      <code class="pr-hex-mid-2">#73c3ff</code>
    </div>
</div>
</body></html>
