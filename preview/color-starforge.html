<!doctype html>
<html lang="en" data-theme="neon-command" data-density="comfortable" data-motion="cinematic">
<head>
<meta charset="utf-8">
<title>color-starforge</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body.atmosphere { padding: 18px 22px; min-height: 160px; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 14px; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .grid { display: grid; gap: 10px; }
</style>
</head>
<body class="atmosphere">
<div class="row" style="flex-wrap: wrap; gap: 10px;" data-theme="starforge">
  <div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-start;">
      <div style="width: 88px; height: 64px; background: #05050b; border: 1px solid rgba(132,124,190,.28); border-radius: 10px;"></div>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #f4f4ff;">--bg</code>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #b0b2cf;">#05050b</code>
    </div><div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-start;">
      <div style="width: 88px; height: 64px; background: #111120; border: 1px solid rgba(132,124,190,.28); border-radius: 10px;"></div>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #f4f4ff;">--bg-elev</code>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #b0b2cf;">#111120</code>
    </div><div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-start;">
      <div style="width: 88px; height: 64px; background: #f4f4ff; border: 1px solid rgba(132,124,190,.28); border-radius: 10px;"></div>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #f4f4ff;">--text</code>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #b0b2cf;">#f4f4ff</code>
    </div><div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-start;">
      <div style="width: 88px; height: 64px; background: #b0b2cf; border: 1px solid rgba(132,124,190,.28); border-radius: 10px;"></div>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #f4f4ff;">--muted</code>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #b0b2cf;">#b0b2cf</code>
    </div><div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-start;">
      <div style="width: 88px; height: 64px; background: #f4a524; border: 1px solid rgba(132,124,190,.28); border-radius: 10px;"></div>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #f4f4ff;">--accent</code>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #b0b2cf;">#f4a524</code>
    </div><div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-start;">
      <div style="width: 88px; height: 64px; background: #73c3ff; border: 1px solid rgba(132,124,190,.28); border-radius: 10px;"></div>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #f4f4ff;">--accent-2</code>
      <code style="font-family: var(--font-mono); font-size: 10px; color: #b0b2cf;">#73c3ff</code>
    </div>
</div>
</body></html>
