<!doctype html>
<html lang="en" data-theme="neon-command" data-density="comfortable" data-motion="cinematic">
<head>
<meta charset="utf-8">
<title>spacing-motion</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body.atmosphere { padding: 18px 22px; min-height: 160px; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 14px; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .grid { display: grid; gap: 10px; }
</style>
</head>
<body class="atmosphere">
<div class="col" style="gap: 10px;">
  <div style="display: grid; grid-template-columns: 90px 1fr 60px; gap: 12px; align-items: center; font-family: var(--font-body); font-size: 12px;">
    <code style="font-family: var(--font-mono); font-size: 11px; color: var(--accent-2);">--dur-quick</code>
    <span style="color: var(--text);">hover · color shift</span>
    <code style="font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-align: right;">150ms</code>

    <code style="font-family: var(--font-mono); font-size: 11px; color: var(--accent-2);">--dur-base</code>
    <span style="color: var(--text);">general transitions</span>
    <code style="font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-align: right;">180ms</code>

    <code style="font-family: var(--font-mono); font-size: 11px; color: var(--accent-2);">--dur-slow</code>
    <span style="color: var(--text);">fade-up mount</span>
    <code style="font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-align: right;">420ms</code>

    <code style="font-family: var(--font-mono); font-size: 11px; color: var(--accent-2);">--ease-out</code>
    <span style="color: var(--text); font-family: var(--font-mono); font-size: 10px;">cubic-bezier(.22, 1, .36, 1)</span>
    <span></span>
  </div>
  <div style="font-family: var(--font-body); font-size: 11px; color: var(--muted);">Fast, additive, no springs. <code style="font-family: var(--font-mono); color: var(--muted);">data-motion="minimal"</code> collapses all to 1ms.</div>
</div>
</body></html>
