<!doctype html>
<html lang="en" data-theme="neon-command" data-density="comfortable" data-motion="cinematic">
<head>
<meta charset="utf-8">
<title>color-status</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="./styles.css">
<style>
  html, body { margin: 0; padding: 0; }
  body.atmosphere { padding: 18px 22px; min-height: 160px; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 14px; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .grid { display: grid; gap: 10px; }
</style>
</head>
<body class="atmosphere">
<div class="row" class="pr-gap-14">
  <div class="pr-flex-col-gap-6-start-wide">
      <div class="pr-flex-row-gap-8-center">
        <span class="pr-dot-success-glow"></span>
        <span class="pr-font-body-13-success">completed</span>
      </div>
      <code class="pr-font-mono-10-text">--success</code>
      <code class="pr-font-mono-10-muted">#2fd67d</code>
    </div><div class="pr-flex-col-gap-6-start-wide">
      <div class="pr-flex-row-gap-8-center">
        <span class="pr-dot-warn-glow"></span>
        <span class="pr-font-body-13-warn">stopped</span>
      </div>
      <code class="pr-font-mono-10-text">--warn</code>
      <code class="pr-font-mono-10-muted">#ffba49</code>
    </div><div class="pr-flex-col-gap-6-start-wide">
      <div class="pr-flex-row-gap-8-center">
        <span class="pr-dot-danger-glow"></span>
        <span class="pr-font-body-13-danger">failed</span>
      </div>
      <code class="pr-font-mono-10-text">--danger</code>
      <code class="pr-font-mono-10-muted">#ff6a76</code>
    </div><div class="pr-flex-col-gap-6-start-wide">
      <div class="pr-flex-row-gap-8-center">
        <span class="pr-dot-accent-glow"></span>
        <span class="pr-font-body-13-accent">running</span>
      </div>
      <code class="pr-font-mono-10-text">--accent-2</code>
      <code class="pr-font-mono-10-muted">#59a7ff</code>
    </div>
</div>
</body></html>
