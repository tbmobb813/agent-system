<!doctype html>
<html lang="en" data-theme="neon-command" data-density="comfortable" data-motion="cinematic">
<head>
<meta charset="utf-8">
<title>type-eyebrow</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body.atmosphere { padding: 18px 22px; min-height: 160px; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 14px; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .grid { display: grid; gap: 10px; }
</style>
</head>
<body class="atmosphere">
<div class="col" style="gap: 14px;">
  <div>
    <p class="eyebrow" style="margin: 0 0 4px 0;">Command Center</p>
    <h1 class="section-title" style="margin: 0; font-size: 28px;">Welcome back, operator</h1>
  </div>
  <div style="display: flex; gap: 8px; flex-wrap: wrap;">
    <span style="font-family: var(--font-body); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--border); background: var(--surface-soft); padding: 4px 8px; border-radius: 6px;">CORE</span>
    <span style="font-family: var(--font-body); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--border); background: var(--surface-soft); padding: 4px 8px; border-radius: 6px;">LOGS</span>
    <span style="font-family: var(--font-body); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--border); background: var(--surface-soft); padding: 4px 8px; border-radius: 6px;">COST</span>
    <span style="font-family: var(--font-body); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--border); background: var(--surface-soft); padding: 4px 8px; border-radius: 6px;">DATA</span>
    <span style="font-family: var(--font-body); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--border); background: var(--surface-soft); padding: 4px 8px; border-radius: 6px;">CONF</span>
  </div>
</div>
</body></html>
