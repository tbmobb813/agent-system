<!doctype html>
<html lang="en" data-theme="neon-command" data-density="comfortable" data-motion="cinematic">
<head>
<meta charset="utf-8">
<title>comp-panel</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="./styles.css">
<style>
  html, body { margin: 0; padding: 0; }
  body.atmosphere { padding: 18px 22px; min-height: 160px; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 14px; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .grid { display: grid; gap: 10px; }
</style>
</head>
<body class="atmosphere">
<div class="panel" class="pr-padding-16-18">
  <div class="pr-flex-between-items-margin">
    <h2 class="section-title" style="font-size: 14px; margin: 0;">Recent Tasks</h2>
    <a href="#" class="pr-font-body-11-accent-link">View all →</a>
  </div>
  <div class="pr-grid-64-1fr-auto-auto-12-border">
    <span class="status-ok" class="pr-text-semibold">completed</span>
    <span class="pr-text-text">Summarize quarterly OKRs from PDF</span>
    <span class="pr-text-muted-11">5m ago</span>
    <span class="pr-text-muted-11">$0.0042</span>
  </div>
  <div class="pr-grid-64-1fr-auto-auto-12">
    <span class="status-running" class="pr-text-semibold">running</span>
    <span class="pr-text-text">Compare GPT-4o and Sonnet on regex tasks</span>
    <span class="pr-text-muted-11">just now</span>
    <span class="pr-text-muted-11">—</span>
  </div>
</div>
</body></html>
