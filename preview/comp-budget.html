<!doctype html>
<html lang="en" data-theme="neon-command" data-density="comfortable" data-motion="cinematic">
<head>
<meta charset="utf-8">
<title>comp-budget</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="./styles.css">
<style>
  html, body { margin: 0; padding: 0; }
  body.atmosphere { padding: 18px 22px; min-height: 160px; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 14px; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .grid { display: grid; gap: 10px; }
</style>
</head>
<body class="atmosphere">
<div class="panel pr-padding-16-18">
  <div class="pr-flex-between-items">
    <span class="pr-font-body-13-muted">Monthly budget</span>
    <span style="font-family: var(--font-body); font-size: 13px; font-weight: 600; color: var(--success);">14.1%</span>
  </div>
  <progress class="budget-progress" max="100" value="14.1"></progress>
  <div class="pr-flex-between-text">
    <span>spent today: <span class="pr-text-text">$0.47</span></span>
    <span>remaining: <span class="pr-text-text">$25.77</span></span>
  </div>
</div>
</body></html>
