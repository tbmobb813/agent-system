<!doctype html>
<html lang="en" data-theme="neon-command" data-density="comfortable" data-motion="cinematic">
<head>
<meta charset="utf-8">
<title>color-clean-tech</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="./styles.css">
<style>
  html, body { margin: 0; padding: 0; }
  body.atmosphere { padding: 18px 22px; min-height: 160px; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 14px; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .grid { display: grid; gap: 10px; }
</style>
</head>
<body class="atmosphere">
<div class="row" class="pr-flex-wrap-bg">
  <div class="pr-flex-col-gap-6-start">
      <div style="width: 88px; height: 64px; background: #f2f7ff; border: 1px solid rgba(68,96,134,.23); border-radius: 10px;"></div>
      <code class="pr-hex-dark">--bg</code>
      <code class="pr-hex-mid-3">#f2f7ff</code>
    </div><div class="pr-flex-col-gap-6-start">
      <div style="width: 88px; height: 64px; background: #ffffff; border: 1px solid rgba(68,96,134,.23); border-radius: 10px;"></div>
      <code class="pr-hex-dark">--bg-elev</code>
      <code class="pr-hex-mid-3">#ffffff</code>
    </div><div class="pr-flex-col-gap-6-start">
      <div style="width: 88px; height: 64px; background: #13213a; border: 1px solid rgba(68,96,134,.23); border-radius: 10px;"></div>
      <code class="pr-hex-dark">--text</code>
      <code class="pr-hex-mid-3">#13213a</code>
    </div><div class="pr-flex-col-gap-6-start">
      <div style="width: 88px; height: 64px; background: #50678a; border: 1px solid rgba(68,96,134,.23); border-radius: 10px;"></div>
      <code class="pr-hex-dark">--muted</code>
      <code class="pr-hex-mid-3">#50678a</code>
    </div><div class="pr-flex-col-gap-6-start">
      <div style="width: 88px; height: 64px; background: #007cf5; border: 1px solid rgba(68,96,134,.23); border-radius: 10px;"></div>
      <code class="pr-hex-dark">--accent</code>
      <code class="pr-hex-mid-3">#007cf5</code>
    </div><div class="pr-flex-col-gap-6-start">
      <div style="width: 88px; height: 64px; background: #15c2a6; border: 1px solid rgba(68,96,134,.23); border-radius: 10px;"></div>
      <code class="pr-hex-dark">--accent-2</code>
      <code class="pr-hex-mid-3">#15c2a6</code>
    </div>
</div>
</body></html>
