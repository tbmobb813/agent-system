<!doctype html>
<html lang="en" data-theme="neon-command" data-density="comfortable" data-motion="cinematic">
<head>
<meta charset="utf-8">
<title>comp-statpills</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="./styles.css">
<style>
  html, body { margin: 0; padding: 0; }
  body.atmosphere { padding: 18px 22px; min-height: 160px; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 14px; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .grid { display: grid; gap: 10px; }
</style>
</head>
<body class="atmosphere">
<div class="col pr-gap-10">
  <div class="pr-flex-row-gap-14-center">
    <span class="pr-font-body-13-inline">
      <span class="pr-dot-success"></span>
      <span class="pr-text-text-bold">Agent Online</span>
      <span class="pr-text-muted-11">· 142 total tasks</span>
    </span>
  </div>
  <div class="pr-flex-row-gap-14-center">
    <span class="pr-font-body-13-inline">
      <span class="pr-dot-danger"></span>
      <span class="pr-text-text-bold">Agent Offline</span>
      <span class="pr-text-muted-11">· check OPENROUTER_API_KEY</span>
    </span>
  </div>
  <div class="pr-flex-row-gap-14-center">
    <span class="pr-font-body-13-inline">
      <span class="pr-dot-warn"></span>
      <span class="pr-text-text-bold">Budget 87%</span>
      <span class="pr-text-muted-11">· $3.92 remaining</span>
    </span>
  </div>
</div>
</body></html>
