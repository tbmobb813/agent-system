<!doctype html>
<html lang="en" data-theme="neon-command" data-density="comfortable" data-motion="cinematic">
<head>
<meta charset="utf-8">
<title>comp-chips</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body.atmosphere { padding: 18px 22px; min-height: 160px; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 14px; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .grid { display: grid; gap: 10px; }
</style>
</head>
<body class="atmosphere">
<div class="col" style="gap: 12px;">
  <div style="display: flex; gap: 8px; flex-wrap: wrap;">
    <span style="font-family: var(--font-body); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--border); background: var(--surface-soft); padding: 4px 8px; border-radius: 6px;">CORE</span><span style="font-family: var(--font-body); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--border); background: var(--surface-soft); padding: 4px 8px; border-radius: 6px;">LOGS</span><span style="font-family: var(--font-body); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--border); background: var(--surface-soft); padding: 4px 8px; border-radius: 6px;">COST</span><span style="font-family: var(--font-body); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--border); background: var(--surface-soft); padding: 4px 8px; border-radius: 6px;">DATA</span><span style="font-family: var(--font-body); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--border); background: var(--surface-soft); padding: 4px 8px; border-radius: 6px;">DOCS</span><span style="font-family: var(--font-body); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--border); background: var(--surface-soft); padding: 4px 8px; border-radius: 6px;">CONF</span><span style="font-family: var(--font-body); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--border); background: var(--surface-soft); padding: 4px 8px; border-radius: 6px;">CMD</span>
  </div>
  <div style="display: flex; gap: 8px; flex-wrap: wrap;">
    <span style="font-family: var(--font-mono); font-size: 11px; color: var(--accent-2); background: var(--surface-soft); border: 1px solid var(--border); padding: 2px 8px; border-radius: 6px;">PDF</span>
    <span style="font-family: var(--font-mono); font-size: 11px; color: var(--accent-2); background: var(--surface-soft); border: 1px solid var(--border); padding: 2px 8px; border-radius: 6px;">DOCX</span>
    <span style="font-family: var(--font-mono); font-size: 11px; color: var(--accent-2); background: var(--surface-soft); border: 1px solid var(--border); padding: 2px 8px; border-radius: 6px;">MD</span>
    <span style="border-radius: 6px; border: 1px solid rgba(43,227,198,.5); background: var(--surface-soft); color: var(--text); font-family: var(--font-body); font-size: 11px; padding: 4px 10px;">Profile: Streamer</span>
  </div>
</div>
</body></html>
